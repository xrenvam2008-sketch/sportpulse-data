name: Update Russian radio playlist

on:
  schedule:
    - cron: "27 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build localized Russian radio M3U
        run: python3 scripts/update_russian_radio_ru.py
      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iptv/russian_radio_RU.m3u
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Russian radio playlist"
            git push
          fi
